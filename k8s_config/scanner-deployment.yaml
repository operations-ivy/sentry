# The scanner: one pod, on the node whose radio should listen (brick666, next
# to the Wi-Fi watch's wlmon0). It's a place, not a replica, so there's exactly one and a
# rollout stops the old pod before starting the new one. It reaches the host's
# bluetoothd through the D-Bus system socket and needs no privileges.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overwatch-scanner
  namespace: overwatch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: overwatch-scanner
  template:
    metadata:
      labels:
        app: overwatch-scanner
    spec:
      nodeSelector:
        kubernetes.io/hostname: brick666
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534  # nobody: the host's D-Bus needs a uid it knows (Dockerfile)
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: scanner
        image: whitepatrick/overwatch
        imagePullPolicy: IfNotPresent
        args: ["scan"]
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317"
        - name: LOG_FORMAT
          value: json
        # The first 10 minutes after each start learn the house's usual counts.
        - name: OVERWATCH_LEARN_SECONDS
          value: "600"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: dbus
          mountPath: /run/dbus/system_bus_socket
        resources:
          requests:
            cpu: 20m
            memory: 48Mi
          limits:
            cpu: 500m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        # Ready while BlueZ is scanning.
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: dbus
        hostPath:
          path: /run/dbus/system_bus_socket
          type: Socket
